<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTP Webpage - File Manager</title>
  <style>
    :root {
      --primary-gradient-from: #667eea;
      --primary-gradient-to: #764ba2;
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --text-primary: #333333;
      --text-secondary: #999999;
      --border-color: #dddddd;
      --button-hover: #e9ecef;
      --shadow: rgba(0, 0, 0, 0.3);
      --input-border: #dddddd;
      --modal-overlay: rgba(0, 0, 0, 0.6);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary-gradient-from: #667eea;
        --primary-gradient-to: #764ba2;
        --bg-primary: #1e1e2e;
        --bg-secondary: #2a2a3e;
        --text-primary: #e8e8e8;
        --text-secondary: #aaaaaa;
        --border-color: #444444;
        --button-hover: #3a3a4e;
        --shadow: rgba(0, 0, 0, 0.6);
        --input-border: #444444;
        --modal-overlay: rgba(0, 0, 0, 0.8);
      }
    }

    html[data-theme="dark"] {
      --primary-gradient-from: #667eea;
      --primary-gradient-to: #764ba2;
      --bg-primary: #1e1e2e;
      --bg-secondary: #2a2a3e;
      --text-primary: #e8e8e8;
      --text-secondary: #aaaaaa;
      --border-color: #444444;
      --button-hover: #3a3a4e;
      --shadow: rgba(0, 0, 0, 0.6);
      --input-border: #444444;
      --modal-overlay: rgba(0, 0, 0, 0.8);
    }

    html[data-theme="light"] {
      --primary-gradient-from: #667eea;
      --primary-gradient-to: #764ba2;
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --text-primary: #333333;
      --text-secondary: #999999;
      --border-color: #dddddd;
      --button-hover: #e9ecef;
      --shadow: rgba(0, 0, 0, 0.3);
      --input-border: #dddddd;
      --modal-overlay: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--primary-gradient-from) 0%, var(--primary-gradient-to) 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--bg-primary);
      border-radius: 12px;
      box-shadow: 0 20px 60px var(--shadow);
      overflow: hidden;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-gradient-from) 0%, var(--primary-gradient-to) 100%);
      color: white;
      padding: 40px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-content {
      text-align: center;
      flex: 1;
      min-width: 250px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.95;
    }

    .theme-toggle {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px;
      border-radius: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .theme-toggle-btn {
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.85em;
      font-weight: 500;
      transition: all 0.3s ease;
      opacity: 0.7;
    }

    .theme-toggle-btn.active {
      background: rgba(255, 255, 255, 0.3);
      opacity: 1;
    }

    .theme-toggle-btn:hover {
      opacity: 1;
    }

    .content {
      padding: 30px;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 0.95em;
    }

    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-primary);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 20px 60px var(--shadow);
      max-width: 500px;
      width: 100%;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .modal-header {
      font-size: 1.5em;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      background: var(--bg-secondary);
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-primary,
    .btn-secondary {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: var(--button-hover);
    }

    .file-tree {
      margin-top: 20px;
    }

    .tree-node {
      margin-bottom: 5px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.3s ease;
      border-left: 4px solid #667eea;
      color: var(--text-primary);
    }

    .tree-item:hover {
      background: var(--button-hover);
      transform: translateX(5px);
      border-left-color: #764ba2;
    }

    .tree-item.directory {
      font-weight: 600;
    }

    .tree-icon {
      font-size: 1.2em;
      margin-right: 12px;
      min-width: 25px;
    }

    .tree-name {
      flex: 1;
      word-break: break-word;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .tree-actions {
      display: flex;
      gap: 5px;
    }

    .tree-btn {
      padding: 5px 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.2s ease;
      border-radius: 4px;
    }

    .tree-btn.download {
      color: #667eea;
    }

    .tree-btn.download:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .tree-btn.delete {
      color: #dc3545;
    }

    .tree-btn.delete:hover {
      background: rgba(220, 53, 69, 0.1);
    }

    .tree-indent {
      margin-left: 30px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 40px;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .empty-state p {
      font-size: 1.1em;
      margin-bottom: 20px;
      color: var(--text-secondary);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      border: 4px solid var(--bg-secondary);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      transition: all 0.3s ease;
    }

    .message.success {
      background: #d4edda;
      border-left: 4px solid #28a745;
      color: #155724;
    }

    .message.error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      color: #721c24;
    }

    html[data-theme="dark"] .message.success {
      background: #1e4620;
      color: #7dd87d;
    }

    html[data-theme="dark"] .message.error {
      background: #4a1f1f;
      color: #ff7f7f;
    }

    .message.active {
      display: block;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .drag-drop-zone {
      border: 2px dashed #667eea;
      border-radius: 6px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      background: var(--bg-secondary);
    }

    .drag-drop-zone.active {
      background: rgba(102, 126, 234, 0.1);
      border-color: #764ba2;
    }

    .drag-drop-zone p {
      color: #667eea;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .drag-drop-zone .small {
      font-size: 0.9em;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <h1>📁 FTP File Manager</h1>
        <p>Upload, organize, and manage your project files</p>
      </div>
      <div class="theme-toggle">
        <button class="theme-toggle-btn active" data-theme="auto" onclick="setTheme('auto')" title="System preference">🎨 Auto</button>
        <button class="theme-toggle-btn" data-theme="light" onclick="setTheme('light')" title="Light mode">☀️ Light</button>
        <button class="theme-toggle-btn" data-theme="dark" onclick="setTheme('dark')" title="Dark mode">🌙 Dark</button>
      </div>
    </div>

    <div class="content">
      <div id="message" class="message"></div>

      <div class="actions">
        <button class="action-btn" onclick="openUploadModal()">📤 Upload File</button>
        <button class="action-btn" onclick="openMkdirModal()">📁 Create Folder</button>
        <button class="action-btn" onclick="loadFiles()">🔄 Refresh</button>
      </div>

      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Loading files...</p>
      </div>

      <div id="file-container"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">📤 Upload File</div>
      <div class="drag-drop-zone" id="dragDropZone">
        <p>Drag and drop files here</p>
        <span class="small">or click to select</span>
      </div>
      <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group file-input-wrapper">
          <label for="fileInput">Select File:</label>
          <input type="file" id="fileInput" required>
        </div>
        <div class="form-group">
          <label for="uploadDir">Upload to Folder (optional):</label>
          <select id="uploadDir" style="width: 100%; padding: 10px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit;">
            <option value="">Root (files/)</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-primary">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Mkdir Modal -->
  <div id="mkdirModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">📁 Create New Folder</div>
      <form onsubmit="handleMkdir(event)">
        <div class="form-group">
          <label for="dirName">Folder Name:</label>
          <input type="text" id="dirName" placeholder="e.g., my-project" required pattern="[a-zA-Z0-9_-]+">
          <small style="color: var(--text-secondary); margin-top: 5px; display: block; transition: color 0.3s ease;">Alphanumeric, dash, and underscore only</small>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeMkdirModal()">Cancel</button>
          <button type="submit" class="btn-primary">Create Folder</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'auto';
      setTheme(savedTheme, false);
    }

    function setTheme(theme, save = true) {
      const html = document.documentElement;
      const buttons = document.querySelectorAll('.theme-toggle-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-theme="${theme}"]`).classList.add('active');

      if (theme === 'auto') {
        html.removeAttribute('data-theme');
      } else {
        html.setAttribute('data-theme', theme);
      }

      if (save) {
        localStorage.setItem('theme', theme);
      }
    }

    // Drag and drop setup
    const dragDropZone = document.getElementById('dragDropZone');
    dragDropZone.addEventListener('click', () => document.getElementById('fileInput').click());
    dragDropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dragDropZone.classList.add('active');
    });
    dragDropZone.addEventListener('dragleave', () => {
      dragDropZone.classList.remove('active');
    });
    dragDropZone.addEventListener('drop', e => {
      e.preventDefault();
      dragDropZone.classList.remove('active');
      if (e.dataTransfer.files.length) {
        document.getElementById('fileInput').files = e.dataTransfer.files;
      }
    });

    function showMessage(text, type = 'success') {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type} active`;
      setTimeout(() => msg.classList.remove('active'), 3000);
    }

    function openUploadModal() {
      populateDirectorySelect();
      document.getElementById('uploadModal').classList.add('active');
    }

    function populateDirectorySelect() {
      const select = document.getElementById('uploadDir');
      const currentValue = select.value;
      const options = [{ label: 'Root (files/)', value: '' }];

      function addDirs(items, prefix = '') {
        if (!items) return;
        items.forEach(item => {
          if (item.type === 'directory') {
            const fullPath = prefix ? `${prefix}/${item.name}` : item.name;
            options.push({ label: `📁 ${prefix ? prefix + '/' : ''}${item.name}`, value: fullPath });
            addDirs(item.children, fullPath);
          }
        });
      }

      const currentItems = window.currentFileItems || [];
      addDirs(currentItems);

      select.innerHTML = options.map(opt =>
        `<option value="${escapeAttr(opt.value)}">${escapeHtml(opt.label)}</option>`
      ).join('');
      select.value = currentValue;
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.remove('active');
      document.getElementById('uploadForm').reset();
    }

    function openMkdirModal() {
      document.getElementById('mkdirModal').classList.add('active');
    }

    function closeMkdirModal() {
      document.getElementById('mkdirModal').classList.remove('active');
      document.getElementById('dirName').value = '';
    }

    async function handleUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const dir = document.getElementById('uploadDir').value;

      if (!file) {
        showMessage('Please select a file', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      if (dir) {
        formData.append('dir', dir);
      }

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Upload failed');
        }

        showMessage(`File "${file.name}" uploaded to ${dir || 'root'} successfully`, 'success');
        closeUploadModal();
        loadFiles();
      } catch (err) {
        showMessage(`Upload failed: ${err.message}`, 'error');
        console.error('Upload error:', err);
      }
    }

    async function handleMkdir(e) {
      e.preventDefault();
      const dirName = document.getElementById('dirName').value;

      try {
        const response = await fetch('/api/mkdir', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dirName })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create directory');
        }

        showMessage(`Folder "${dirName}" created successfully`, 'success');
        closeMkdirModal();
        loadFiles();
      } catch (err) {
        showMessage(`Error: ${err.message}`, 'error');
        console.error('Mkdir error:', err);
      }
    }

    async function deleteItem(filePath) {
      if (!confirm('Are you sure you want to delete this?')) return;

      try {
        const response = await fetch('/api/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filePath })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Delete failed');
        }

        showMessage('Deleted successfully', 'success');
        loadFiles();
      } catch (err) {
        showMessage(`Delete failed: ${err.message}`, 'error');
        console.error('Delete error:', err);
      }
    }

    function getFileIcon(filename, isDirectory = false) {
      if (isDirectory) return '📂';

      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        'pdf': '📄', 'txt': '📝', 'zip': '🗜️', 'rar': '🗜️', '7z': '🗜️',
        'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
        'mp4': '🎬', 'mp3': '🎵', 'csv': '📊', 'xlsx': '📊', 'xls': '📊',
        'doc': '📗', 'docx': '📗', 'html': '🌐', 'js': '⚙️', 'json': '⚙️'
      };
      return icons[ext] || '📦';
    }

    function renderTree(items, depth = 0) {
      if (!items || items.length === 0) return '';

      let html = '';
      items.forEach(item => {
        const indent = depth > 0 ? ` tree-indent` : '';
        const icon = getFileIcon(item.name, item.type === 'directory');

        if (item.type === 'directory') {
          html += `
            <div class="tree-node${indent}">
              <div class="tree-item directory">
                <span class="tree-icon">${icon}</span>
                <span class="tree-name">${escapeHtml(item.name)}/</span>
                <div class="tree-actions">
                  <button class="tree-btn delete" onclick="deleteItem('${escapeAttr(item.path)}')" title="Delete">🗑️</button>
                </div>
              </div>
              ${renderTree(item.children, depth + 1)}
            </div>
          `;
        } else {
          html += `
            <div class="tree-node${indent}">
              <div class="tree-item">
                <span class="tree-icon">${icon}</span>
                <span class="tree-name">${escapeHtml(item.name)}</span>
                <div class="tree-actions">
                  <a href="${item.downloadPath}" class="tree-btn download" download title="Download">⬇️</a>
                  <button class="tree-btn delete" onclick="deleteItem('${escapeAttr(item.path)}')" title="Delete">🗑️</button>
                </div>
              </div>
            </div>
          `;
        }
      });
      return html;
    }

    async function loadFiles() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('file-container');

      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        const response = await fetch('/api/files');
        if (!response.ok) throw new Error('Failed to load files');

        const data = await response.json();
        window.currentFileItems = data.items;
        loading.style.display = 'none';

        if (!data.items || data.items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <p>No files yet</p>
              <p style="font-size: 0.95em;">Upload files or create folders to get started</p>
            </div>
          `;
          return;
        }

        const html = `
          <div class="file-tree">
            ${renderTree(data.items)}
          </div>
        `;
        container.innerHTML = html;
      } catch (err) {
        loading.style.display = 'none';
        container.innerHTML = `
          <div style="padding: 20px; background: #fff3cd; border-left: 4px solid #ffc107; border-radius: 6px; color: #856404;">
            Error loading files: ${escapeHtml(err.message)}
          </div>
        `;
        console.error('Error loading files:', err);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function escapeAttr(text) {
      return escapeHtml(text);
    }

    // Initialize theme and load files on page load
    initTheme();
    loadFiles();
  </script>
</body>
</html>
